H('Match');r=row();btn(r,'Start',startMatch);btn(r,'Instant win',()=>{if(M.active)endMatch(true)});btn(r,'Instant lose',()=>{if(M.active)endMatch(false)});btn(r,'Full heal',()=>{M.hp=100;M.sh=100});btn(r,'Tower -50%',()=>{if(M.active)M.th/=2});btn(r,'Clear enemies',()=>{M.en=[]});
r=row();const gb=E('button',null,'God mode: '+(S.god?'ON':'OFF'));gb.onclick=()=>{S.god=S.god?0:1;gb.textContent='God mode: '+(S.god?'ON':'OFF');save()};r.append(gb);const fn=num(r,S.wins+1,'60px');btn(r,'Set fight #',()=>S.wins=Math.max(0,(+fn.value||1)-1));
H('Season / time');r=row();const sn=sel(r,[['','Auto (by date)'],['th','Treasure Hunters'],['gd','Glacial Drift']]);sn.value=S.sOv||'';btn(r,'Set season',()=>{S.sOv=sn.value;SEASON=SEAS[curSeason()].name;buildMq()});
r=row();const dn=num(r,1,'60px');btn(r,'+Days (shop grows)',()=>S.dayOff=(S.dayOff||0)+(+dn.value||0));btn(r,'Reset days',()=>S.dayOff=0);
H('More tools');r=row();
const tg=(r,k,l)=>{const b=E('button',null,l+': '+(S[k]?'ON':'OFF'));b.onclick=()=>{S[k]=S[k]?0:1;b.textContent=l+': '+(S[k]?'ON':'OFF');save()};r.append(b)};tg(r,'infAmmo','Infinite ammo');tg(r,'oneHit','One-hit kills');
r=row();btn(r,'Spawn enemy',()=>{if(M.active&&!M.boss){const _w=ePick(M.d);M.en.push({w:_w,x:505,y:GY-4+Math.random()*16,look:EL[Math.random()*EL.length|0],h:Math.random()*6,hit:0,am:WEAP[_w].mag,rl:0,cd:Math.random(),sf:0})}});btn(r,'Shield 100',()=>{M.sh=100});btn(r,'+1 revive',()=>{M.rev=(M.rev||0)+1});
r=row();const bs=sel(r,[[0,'A$AP Rocky'],[1,'Usopp']]);btn(r,'Start boss fight',()=>{if(M.active)return;window.FB=+bs.value;S.wins=Math.ceil((S.wins+1)/10)*10-1;startMatch();window.FB=null});
r=row();const as=sel(r,AREAS[curSeason()].map((a,i)=>[i,AN[a]]));btn(r,'Go to area',()=>{S.wins=25*(+as.value);areaFlash()});
r=row();r.append('Time of day: ');const tt=num(r,12,'60px');btn(r,'Set',()=>S.todOv=+tt.value);btn(r,'Real time',()=>S.todOv=-1);
H('Base & upgrades');r=row();btn(r,'Finish step',()=>{const st=BS();if(BSTEP(st.step)){st.step++;st.prog=0}});btn(r,'Complete tower',()=>{BS().step=Math.max(BS().step,6);BS().prog=0});btn(r,'Max base',()=>{BS().step=BTOT;BS().prog=0});btn(r,'Clear base',()=>{S.bs={step:0,prog:0};S.bhp=0});
r=row();btn(r,'Max upgrades',()=>{UP.forEach(u=>S.up[u[0]]=20)});btn(r,'Reset upgrades',()=>{S.up={}});btn(r,'+100k gold',()=>S.gold+=1e5);
r=row();const cc=num(r,0,'70px');btn(r,'Set chests opened',()=>S.chests=+cc.value||0);btn(r,'Reset chest price',()=>S.chests=0);
H('Save data');r=row();const ta=E('textarea');ta.style.cssText='width:100%;height:60px;background:#000;color:#fff;font-size:10px';r.append(ta);r=row();btn(r,'Export',()=>{ta.value=enc(S)});btn(r,'Import',()=>{{const o=dec(ta.value);if(o)S=Object.assign(fresh(),o);else toast('Bad save code')}});btn(r,'RESET ALL',()=>{if(confirm('Delete all progress?')){S=fresh();SEASON='Treasure Hunters';buildMq()}})}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&!(getSelection()+'')){e.preventDefault();admToggle()}});
// loops
SEASON=SEAS[curSeason()].name;buildMq();recalc();render();if(TAMP)setTimeout(()=>toast('Save was edited — progress reset'),600);requestAnimationFrame(frame);
setInterval(()=>{S.vb+=PS*.1},100);setInterval(ui,250);setInterval(()=>{const n=SEAS[curSeason()].name;if(n!==SEASON){SEASON=n;buildMq();render()}},5000);setInterval(save,5000);
</script></body></html>
